<script>
    document.addEventListener("DOMContentLoaded", function () {
        console.log("🚀 Initializing mobile menu...");

        const burger = document.querySelector(".mobileMenuHandler");
        const mobileMenu = document.querySelector(".header__mobile-content");
        const header = document.querySelector("header");

        console.log("📱 Finding elements:", { burger: !!burger, mobileMenu: !!mobileMenu, header: !!header });

        if (!burger || !mobileMenu || !header) {
            console.error("❌ Mobile menu elements not found!");
            return;
        }

        // Function to close mobile menu (local version)
        function closeMobileMenuLocal() {
            console.log("🔐 Closing mobile menu locally");

            mobileMenu.classList.remove("menu-open");
            burger.classList.remove("burger-active");

            // Unlock scroll
            const scrollY = document.body.style.getPropertyValue('--scroll-y');
            document.body.classList.remove("lock-scroll");
            document.body.style.removeProperty('--scroll-y');
            if (scrollY) {
                window.scrollTo(0, parseInt(scrollY || '0') * -1);
            }

            // Jika scrollY <= 50, hapus header_filled
            if (window.scrollY <= 50) {
                header.classList.remove("header_filled");
            }
        }

        // Close button menggunakan inline JavaScript di HTML

        // BURGER TOGGLE
        burger.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();

            console.log("🍔 Burger clicked!");

            const isOpen = mobileMenu.classList.contains("menu-open");
            console.log("📱 Menu is currently open:", isOpen);

            // Lock/unlock body scroll
            if (!isOpen) {
                const scrollY = window.scrollY;
                document.body.style.setProperty('--scroll-y', `-${scrollY}px`);
                document.body.classList.add("lock-scroll");
                console.log("🔒 Menu opening, scroll locked");

                // Toggle menu & burger
                mobileMenu.classList.add("menu-open");
                burger.classList.add("burger-active");

                // Force menu items to be visible after opening
                setTimeout(function () {
                    debugMenuLinks();
                    console.log("🔄 Forcing menu visibility after opening");
                }, 100);

            } else {
                closeMobileMenuLocal();
            }

            // Tambahkan header_filled jika menu dibuka
            if (!header.classList.contains("header_filled")) {
                header.classList.add("header_filled");
            }

            console.log("📱 Menu classes after toggle:", mobileMenu.className);
        });

        // SCROLL BEHAVIOR
        window.addEventListener("scroll", function () {
            const isMenuOpen = mobileMenu.classList.contains("menu-open");

            if (window.scrollY > 50 || isMenuOpen) {
                header.classList.add("header_filled");
            } else {
                header.classList.remove("header_filled");
            }
        });

        // CLICK OUTSIDE TO CLOSE MENU (but allow menu item clicks)
        document.addEventListener("click", function (e) {
            // Allow clicks on menu items to go through and close menu after navigation
            const menuLink = e.target.closest('.header__mobile-content .menu a');
            if (menuLink) {
                console.log("🔗 Menu link clicked:", menuLink.textContent.trim(), "- closing menu");
                // Close menu when menu item is clicked
                setTimeout(function () {
                    closeMobileMenuLocal();
                }, 100);
                return;
            }

            // Check click outside (close button already handled inline)
            const isInsideBurger = burger.contains(e.target);
            const isInsideMenu = mobileMenu.contains(e.target);
            const isCloseButton = e.target.closest('.mobile-close-button');

            if (!isInsideBurger && !isInsideMenu && !isCloseButton && mobileMenu.classList.contains("menu-open")) {
                console.log("👆 Clicking outside, closing menu");
                closeMobileMenuLocal();
            }
        });

        // Clean visibility check - no forced styling
        function debugMenuLinks() {
            const menuLinks = document.querySelectorAll('.header__mobile-content .menu a');
            const menuItems = document.querySelectorAll('.header__mobile-content .menu ul li');

            console.log("🔗 Found menu links:", menuLinks.length);
            console.log("📋 Found menu items:", menuItems.length);

            // Just ensure visibility without background/border styling
            menuItems.forEach((item, index) => {
                console.log(`📋 Item ${index + 1}:`, item.textContent.trim());
                item.style.opacity = '1';
                item.style.visibility = 'visible';
            });

            menuLinks.forEach((link, index) => {
                console.log(`🔗 Link ${index + 1}:`, link.href, link.textContent.trim());

                // Only ensure visibility and color - no backgrounds
                link.style.opacity = '1';
                link.style.visibility = 'visible';
                link.style.color = '#ffffff';
                link.style.background = 'none';
                link.style.border = 'none';
                link.style.boxShadow = 'none';

                // Add click events
                link.addEventListener('click', function (e) {
                    console.log("🔗 Menu link clicked:", this.textContent.trim(), this.href);
                }, true);

                link.addEventListener('touchend', function (e) {
                    console.log("👆 Menu link touched:", this.textContent.trim(), this.href);
                }, true);
            });
        }

        // Run debug after a short delay to ensure DOM is ready
        setTimeout(debugMenuLinks, 500);

        console.log("✅ Mobile menu initialization complete!");
    });
</script>
