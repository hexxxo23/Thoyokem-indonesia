<!-- Contact Form Section -->
<div class="section__contact-form" id="contact-form">
    <div class="container">
        <div class="content">
            <h2 class="title">Butuh Bantuan?</h2>
            <p class="text">Silakan isi formulir ini untuk memulai percakapan — kami akan segera menghubungi Anda kembali.<span class="form-line"><span></span></span></p>
        </div>

        <div class="form">
            <div role="form" class="wpcf7" id="wpcf7-f964-o1" lang="en-US" dir="ltr">
                <div class="screen-reader-response"><p role="status" aria-live="polite" aria-atomic="true"></p><ul></ul></div>
                <form action="#" method="post" class="wpcf7-form init" novalidate="novalidate" data-status="init" id="gmailForm">
                    <p><span class="wpcf7-form-control-wrap f-name">
                        <input type="text" name="f-name" value="" size="40" minlength="3" class="wpcf7-form-control wpcf7-text wpcf7-validates-as-required" aria-required="true" aria-invalid="false" placeholder="Nama Anda" required>
                    </span></p>
                    
                    <p><span class="wpcf7-form-control-wrap f-company">
                        <input type="text" name="f-company" value="" size="40" minlength="3" class="wpcf7-form-control wpcf7-text" placeholder="Nama Perusahaan">
                    </span></p>
                    
                    <p><span class="wpcf7-form-control-wrap f-email">
                        <input type="email" name="f-email" value="" size="40" class="wpcf7-form-control wpcf7-text wpcf7-validates-as-required" autocomplete="email" aria-required="true" aria-invalid="false" placeholder="Email Anda" required>
                    </span></p>
                    
                    <p><span class="wpcf7-form-control-wrap f-comment">
                        <textarea name="f-comment" cols="40" rows="10" class="wpcf7-form-control wpcf7-textarea" aria-invalid="false" placeholder="Ceritakan kebutuhan Anda" required></textarea>
                    </span></p>
                    
                    <button type="submit" class="wpcf7-form-control wpcf7-submit">Kirim via Gmail</button>
                    <div class="wpcf7-response-output" aria-hidden="true"></div>
                </form>
            </div>
            
            <!-- Success Popup -->
            <div class="form__popup" style="display: none;">
                <div class="subtitle">Amazing!</div>
                <div class="title">Thank you so much!</div>
                <div class="text">See you soon</div>
            </div>
        </div>
    </div>
</div>
